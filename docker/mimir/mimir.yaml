target: all
multitenancy_enabled: false

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1

server:
  http_listen_port: 9009

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/alertmanager

memberlist:
  join_members:
    - mimir
